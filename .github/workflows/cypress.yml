name: Cypress E2E (Stable)

# Runs only the stable suite (cypress/e2e/stable/**) so this workflow
# is a meaningful green/red quality signal. The external/blocked suite
# (auth email-verification, sandbox hCaptcha, language-selector drift)
# lives in cypress-external.yml, triggered manually - see that file
# and FINAL_REVIEW.md for why those scenarios aren't run here.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint, format check, and run the stable Cypress suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Installs dependencies (npm ci, detected from package-lock.json)
      # and caches both the npm package cache and the Cypress binary -
      # both handled by this action itself. See ARCHITECTURE.md
      # "CI caching" for why this replaced a manual actions/cache step
      # that was ordered after `npm ci` and never actually cached
      # anything.
      - name: Install dependencies
        uses: cypress-io/github-action@v7
        with:
          runTests: false

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run stable Cypress suite
        uses: cypress-io/github-action@v7
        with:
          install: false
          spec: cypress/e2e/stable/**/*.cy.js
        env:
          CYPRESS_WIKI_USERNAME: ${{ secrets.CYPRESS_WIKI_USERNAME }}
          CYPRESS_WIKI_PASSWORD: ${{ secrets.CYPRESS_WIKI_PASSWORD }}

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-report
          path: cypress/reports/html
          if-no-files-found: ignore
          retention-days: 30
