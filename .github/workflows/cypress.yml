name: Cypress E2E (Stable)

# Runs only the stable suite (cypress/e2e/stable/**) so this workflow
# is a meaningful green/red quality signal. The external/blocked suite
# (auth email-verification, sandbox hCaptcha, language-selector drift)
# lives in cypress-external.yml, triggered manually - see that file
# and FINAL_REVIEW.md for why those scenarios aren't run here.
#
# Deliberately self-contained: no repository secrets are required.
# Every stable scenario uses either no credentials at all, or fake
# literal login/password values - real Wikipedia credentials are only
# needed by cypress-external.yml. This lets the workflow run
# unmodified on a fork or any public clone of this repo.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint, format check, and run the stable Cypress suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Cached before `npm ci` runs, so a hit actually skips the
      # download - see ARCHITECTURE.md "CI caching" for the two
      # bugs this replaced: a manual actions/cache step ordered
      # *after* npm ci (never cached anything), then
      # cypress-io/github-action, whose install step failed 3/3 times
      # on this repo's GitHub-hosted runners for a reason that
      # couldn't be diagnosed without full log access. Plain `npm ci`
      # has not failed once in any local or CI run tested so far, and
      # a plain `run:` step prints its full output directly in the
      # log with no extra permissions needed to read it.
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run stable Cypress suite
        run: npx cypress run --spec "cypress/e2e/stable/**/*.cy.js"

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-report
          path: cypress/reports/html
          if-no-files-found: ignore
          retention-days: 30
