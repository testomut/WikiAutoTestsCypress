name: Cypress Smoke

# Deterministic pipeline check: install, lint/format, smoke suite.
# Not a Wikipedia quality gate - see cypress-examples.yml for that.
# Needs no repository secrets and runs unmodified on a fork or clone.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint, format check, and run the smoke suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run smoke suite
        run: npx cypress run --spec "cypress/e2e/smoke/**/*.cy.js"

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-report
          path: cypress/reports/html
          if-no-files-found: ignore
          retention-days: 30
