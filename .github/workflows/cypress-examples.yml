name: Cypress Examples (manual)

# Reference example scenarios (cypress/e2e/examples/**), not part of
# the CI gate - they depend on live Wikipedia state (UI, auth, rate
# limits, anti-abuse), not just this code.
#
# Needs CYPRESS_WIKI_USERNAME/CYPRESS_WIKI_PASSWORD repository secrets.
# Trigger manually: Actions tab -> this workflow -> "Run workflow".

on:
  workflow_dispatch: {}

jobs:
  test:
    name: Run the example Cypress scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run example Cypress scenarios
        run: npx cypress run --spec "cypress/e2e/examples/**/*.cy.js"
        env:
          CYPRESS_WIKI_USERNAME: ${{ secrets.CYPRESS_WIKI_USERNAME }}
          CYPRESS_WIKI_PASSWORD: ${{ secrets.CYPRESS_WIKI_PASSWORD }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-examples-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-examples-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-examples-report
          path: cypress/reports/html
          if-no-files-found: ignore
          retention-days: 30
